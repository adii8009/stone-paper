<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors Gamee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock paper scissors</h1>
    <div class="choises">
        <div class="choise" id="rock">
            <img src="https://thumb.ac-illust.com/7c/7c1b48a67a3f555bb456ac718f3560a0_t.jpeg">
        </div>
        <div class="choise" id="paper">
            <img src="https://rock-paper-scissors-lilac-alpha.vercel.app/static/media/paper.png">
        </div>
        <div class="choise" id="scissor">
            <img src="https://i.pinimg.com/474x/67/eb/fd/67ebfd32e898b4ec3ae4e59ae33832c8.jpg">
        </div>
    </div>
    <div class="scoreboard">
        <div class="score">
            <p id="userscore">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="compscore">0</p>
            <p>comp</p>
        </div>
    </div>

    <div class="msgcontainer">
        <p id="msg">Click on above hoises for the play Game</p>
    </div>


    <script src="first.js"></script>
</body>

</html>
