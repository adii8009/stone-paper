<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors Gamee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock paper scissors</h1>
    <div class="choises">
        <div class="choise" id="rock">
            <img src="./linkedin/rock.png">
        </div>
        <div class="choise" id="paper">
            <img src="./linkedin/paper.png">
        </div>
        <div class="choise" id="scissor">
            <img src="./linkedin/sessior.jpeg">
        </div>
    </div>
    <div class="scoreboard">
        <div class="score">
            <p id="userscore">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="compscore">0</p>
            <p>comp</p>
        </div>
    </div>

    <div class="msgcontainer">
        <p id="msg">Click on above hoises for the play Game</p>
    </div>


    <script src="first.js"></script>
</body>
</html>
